name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # required for npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [ "$PKG_VERSION" != "$TAG_NAME" ]; then
            echo "Release tag $TAG_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest
      - run: npm publish --access public --provenance
